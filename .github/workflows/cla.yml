name: CLA Assistant

# Asks first-time contributors to sign the CLA (see CLA.md) by commenting on
# their PR, and records signatures. Uses the self-hosted contributor-assistant
# action — no external SaaS needed.
#
# REQUIRED ONE-TIME SETUP (by a repo admin):
#   Create a classic Personal Access Token with "repo" scope and add it as a
#   repository secret named PERSONAL_ACCESS_TOKEN. The action needs it to store
#   the signatures file. GITHUB_TOKEN alone is not sufficient.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: "https://github.com/Nomploy/nomploy/blob/main/CLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "main"
          allowlist: "dependabot[bot],*[bot]"
          custom-notsigned-prcomment: >
            Thank you for your contribution! Please sign our
            [Contributor License Agreement](https://github.com/Nomploy/nomploy/blob/main/CLA.md)
            by posting the following comment:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "✅ All contributors have signed the CLA."
