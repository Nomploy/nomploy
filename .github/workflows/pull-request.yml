name: Pull Request

on:
  pull_request:
    branches: [main, canary]

permissions:
  contents: read

# Gate PRs on the SAME checks a release runs (scripts/check.sh): the server prod
# build (the real hard-tsc gate) + the vitest suite. The app's Next build has
# `typescript.ignoreBuildErrors: true`, so app `tsc` is informational only — check.sh
# reports it but does not fail on it, matching what the release image actually enforces.
# (The upstream Dokploy workflow hard-typechecked the whole monorepo and spun up Docker
# Swarm for integration tests; the fork replaced Swarm with Nomad and ignores app TS
# errors in prod, so both of those only produced false reds here.)
jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Release gate (server prod build + tests)
        run: bash scripts/check.sh
