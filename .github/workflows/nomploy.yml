name: Docker Publish (GHCR)

# Builds the app image and pushes it to the GitHub Container Registry using the
# built-in GITHUB_TOKEN — no external secrets.
#
# Channels: a push to `main` publishes `:edge` (rolling dev); a version tag `v*`
# publishes `:vX.Y.Z` AND moves `:latest` (the release channel the panel self-
# updates from). So main never touches production — only tagging a release does.
#
# All builds are amd64-only — the entire nomploy cluster is amd64 (Hetzner cx/ccx),
# so an arm64 leg was pure waste that doubled cost and made releases wait on a
# second runner + a manifest merge for a platform nothing runs. (To ship to an arm
# cluster, add an arm64 entry back to the `setup` matrix; see the note there.)
#
# The image is built on a native runner (no QEMU emulation), pushed by digest, then
# the merge job assembles the final tag manifest.
#
# NOTE: for `install.sh` to `docker pull` without auth, the ghcr package must be
# Public (set it in the package settings once).

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip rebuilds when only docs/licenses change (a code change still triggers).
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "LICENSE-APACHE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - "signatures/**"
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nomploy/nomploy

jobs:
  # Pick the build matrix: multi-arch for releases (v* tags), amd64-only for
  # main (:edge) + manual builds (the hub is amd64, so the edge loop stays fast).
  setup:
    # A release pushes BOTH the commit to main and the tag; both fire this
    # workflow, which would build the same commit twice (:edge + :latest). Skip
    # the redundant :edge build for release commits — the tag build covers them.
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          amd64='{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"}'
          # The whole nomploy cluster is amd64 (Hetzner cx/ccx: hub, servers,
          # workers, autoscaled ccx nodes). arm64 was pure waste — it doubled
          # runner cost and made every release wait on a second (sometimes
          # queued/flaky) leg + a manifest merge for a platform nothing runs.
          # amd64-only for ALL builds now. To ship to an arm cluster, add back an
          # arm64 entry (runner: ubuntu-24.04-arm) to the matrix for v* tags.
          echo "matrix={\"include\":[$amd64]}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # The panel version, baked into the image (Dockerfile ARG -> ENV). A
          # release tag (v0.30.4) bakes that exact version; every other build is
          # the rolling "edge" channel. Releases no longer bump package.json, so
          # this build-arg is the single source of the version the panel reports.
          build-args: |
            NOMPLOY_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'edge' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache (a dedicated GHCR tag), NOT type=gha: the GitHub Actions
          # cache is capped at 10 GB/repo, and mode=max (which caches every build
          # stage — node_modules, the pnpm store, base layers) blew past it, so GitHub
          # evicted layers between runs and nearly every build was cold (~12 min). A
          # registry cache has no such cap, persists reliably, and keeps the install +
          # build stages warm so only changed layers rebuild.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Channel model: `:latest` is a RELEASE channel that only moves on a
          # version tag (v*), and that's what the panel self-updates from. Every
          # push to main publishes `:edge` (the rolling dev channel) instead, so
          # `main` never disturbs production. `:vX.Y.Z` and `:sha-<short>` are
          # always produced for their respective refs.
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        # Inspect the first tag this run actually produced (:edge on main,
        # :latest on a release tag) rather than assuming :latest exists.
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
