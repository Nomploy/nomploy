name: Docker Publish (GHCR)

# Builds the app image and pushes it to the GitHub Container Registry using the
# built-in GITHUB_TOKEN — no external secrets.
#
# Channels: a push to `main` publishes `:edge` (rolling dev); a version tag `v*`
# publishes `:vX.Y.Z` AND moves `:latest` (the release channel the panel self-
# updates from). So main never touches production — only tagging a release does.
#
# Release (v* tag) builds are multi-arch (amd64 + arm64). main (:edge) and manual
# (workflow_dispatch) builds are amd64-only — that's all the hub needs, so the edge
# loop skips the arm64 leg and the manifest wait. The matrix is chosen by `setup`.
#
# Each architecture is built on its OWN native runner (fast, no QEMU emulation),
# pushed by digest, then a merge job assembles the final manifest. Native arm64
# runners (ubuntu-24.04-arm) are free for public repositories.
#
# NOTE: for `install.sh` to `docker pull` without auth, the ghcr package must be
# Public (set it in the package settings once).

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip rebuilds when only docs/licenses change (a code change still triggers).
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "LICENSE-APACHE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - "signatures/**"
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nomploy/nomploy

jobs:
  # Pick the build matrix: multi-arch for releases (v* tags), amd64-only for
  # main (:edge) + manual builds (the hub is amd64, so the edge loop stays fast).
  setup:
    # A release pushes BOTH the commit to main and the tag; both fire this
    # workflow, which would build the same commit twice (:edge + :latest). Skip
    # the redundant :edge build for release commits — the tag build covers them.
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          amd64='{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest"}'
          arm64='{"platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}'
          # Multi-arch only for RELEASES (v* tags). main (:edge) + manual builds
          # are amd64-only (the hub is amd64) — keeps the edge loop fast.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "matrix={\"include\":[$amd64,$arm64]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$amd64]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Channel model: `:latest` is a RELEASE channel that only moves on a
          # version tag (v*), and that's what the panel self-updates from. Every
          # push to main publishes `:edge` (the rolling dev channel) instead, so
          # `main` never disturbs production. `:vX.Y.Z` and `:sha-<short>` are
          # always produced for their respective refs.
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        # Inspect the first tag this run actually produced (:edge on main,
        # :latest on a release tag) rather than assuming :latest exists.
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
